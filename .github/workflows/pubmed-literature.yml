name: PubMed Literature Update

on:
  schedule:
    # 07:00 JST
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-literature:
    runs-on: [self-hosted, Windows, X64, pubmed-local-llm]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate PubMed AI summaries
        run: npm run pubmed:update
        env:
          AI_ENDPOINT_MODE: ${{ vars.AI_ENDPOINT_MODE || 'chat' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'http://127.0.0.1:11434/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'qwen3:8b' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || 'local' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          PUBMED_ALERT_RETMAX: "5"
          PUBMED_IMPORTANT_RETMAX: "5"
          PUBMED_IMPORTANT_LOOKBACK_MONTHS: "24"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit generated summaries
        shell: powershell
        run: |
          git diff --quiet -- src/pubmedGenerated.ts
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No PubMed summary changes."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pubmedGenerated.ts
          git commit -m "Update PubMed literature summaries"
          git push
